name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*']
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Security Audit
      run: npm audit --audit-level=high || true
      shell: bash

    - name: Typecheck
      run: npm run typecheck
      shell: bash

    - name: Lint
      run: npm run lint || true
      shell: bash

    - name: Build
      run: npm run build
      shell: bash

    - name: Install Playwright Browsers (for E2E)
      run: npx playwright install chromium --with-deps
      shell: bash

    - name: Test
      run: npm run test
      shell: bash

    - name: Benchmark
      run: npm run bench || true
      shell: bash

    - name: Test Global Install & E2E CLI (Core + v0.9.8 Features)
      run: |
        npm install -g .
        md2pdf --version
        md2pdf doctor
        
        echo "# E2E Core" > test_core.md
        md2pdf test_core.md -o e2e_core.pdf
        node -e "if (!require('node:fs').existsSync('e2e_core.pdf')) process.exit(1);"
        
        echo "# E2E Password & Watermark" > test_pass.md
        md2pdf test_pass.md -o e2e_pass.pdf --password "secret" --watermark "CONFIDENTIAL"
        node -e "if (!require('node:fs').existsSync('e2e_pass.pdf')) process.exit(1);"
        
        echo "# Chunk 1" > chunk1.md
        echo "# Chunk 2" > chunk2.md
        md2pdf chunk1.md chunk2.md --merge -o e2e_merge.pdf
        node -e "if (!require('node:fs').existsSync('e2e_merge.pdf')) process.exit(1);"
        
        echo -e "# Stdin Batch 1\n---\n# Stdin Batch 2" | md2pdf --stdin --merge -o e2e_stdin.pdf
        node -e "if (!require('node:fs').existsSync('e2e_stdin.pdf')) process.exit(1);"
        
      shell: bash

    - name: Pre-Publish Checks
      if: runner.os == 'Linux' && matrix.node-version == '24.x'
      run: bash scripts/pre-publish.sh --skip-e2e
      shell: bash

    - name: Upload Artifact
      if: runner.os == 'Linux' && matrix.node-version == '24.x'
      uses: actions/upload-artifact@v4
      with:
        name: md2pdf-dist-${{ matrix.os }}
        path: dist/
