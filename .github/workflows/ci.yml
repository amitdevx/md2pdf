name: CI

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Snyk Security Scan
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            npx --yes snyk test --severity-threshold=high || true
            npx --yes snyk code test --severity-threshold=high || true
          else
            echo "SNYK_TOKEN not set, skipping authenticated Snyk scan"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
          - os: ubuntu-latest
            node-version: 24.x
            is-canonical: true
          - os: ubuntu-latest
            node-version: 26.x
          - os: windows-latest
            node-version: 24.x
          - os: macos-latest
            node-version: 24.x

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Poppler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
        shell: bash

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        shell: bash

      - name: Run Test Suite
        run: npm run test
        shell: bash

      - name: Packed Consumer Verification (Canonical)
        if: matrix.is-canonical
        run: |
          TARBALL=$(npm pack)
          CONSUMER_DIR=$(mktemp -d)
          cp "$TARBALL" "$CONSUMER_DIR/"
          pushd "$CONSUMER_DIR"
          npm init -y
          npm install "./$TARBALL"
          npx md2pdf --version
          npx md2pdf doctor
          echo "# Canonical Packed Consumer Test" > test.md
          npx md2pdf test.md -o output.pdf --no-cache --force
          node -e "if (!require('node:fs').existsSync('output.pdf')) process.exit(1);"
          popd
          rm -rf "$CONSUMER_DIR" "$TARBALL"
        shell: bash

      - name: Cross-Platform CLI Functional Verification
        run: |
          node -e "require('node:fs').writeFileSync('cli_core.md', '# CLI Core Check\n')"
          node dist/cli/index.js cli_core.md -o cli_core.pdf --no-cache --force
          node -e "if (!require('node:fs').existsSync('cli_core.pdf')) process.exit(1);"

          node -e "require('node:fs').writeFileSync('cli_pass.md', '# CLI Password & Watermark\n')"
          node dist/cli/index.js cli_pass.md -o cli_pass.pdf --password "secret" --watermark "CONFIDENTIAL" --no-cache --force
          node -e "if (!require('node:fs').existsSync('cli_pass.pdf')) process.exit(1);"

          node -e "require('node:fs').writeFileSync('chunk1.md', '# Chunk 1\n')"
          node -e "require('node:fs').writeFileSync('chunk2.md', '# Chunk 2\n')"
          node dist/cli/index.js --merge -o cli_merge.pdf chunk1.md chunk2.md --no-cache --force
          node -e "if (!require('node:fs').existsSync('cli_merge.pdf')) process.exit(1);"
        shell: bash

      - name: Upload Artifact
        if: matrix.is-canonical
        uses: actions/upload-artifact@v4
        with:
          name: md2pdf-dist-${{ matrix.os }}
          path: dist/
