name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Typecheck
      run: npm run typecheck
      shell: bash

    - name: Lint
      run: npm run lint
      shell: bash

    - name: Build
      run: npm run build
      shell: bash

    - name: Test
      run: npm run test
      shell: bash

    - name: Test Global Install & E2E CLI
      run: |
        npm install -g .
        md2pdf --version
        md2pdf doctor || true
      shell: bash

    - name: Pre-Publish Checks
      if: runner.os == 'Linux' && matrix.node-version == '24.x'
      run: bash scripts/pre-publish.sh --skip-e2e
      shell: bash

    - name: Upload Artifact
      if: runner.os == 'Linux' && matrix.node-version == '24.x'
      uses: actions/upload-artifact@v4
      with:
        name: md2pdf-dist-${{ matrix.os }}
        path: dist/
